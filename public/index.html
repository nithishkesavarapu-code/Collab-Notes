<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collab Notes</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; height: 100vh; background: #f0f2f5; }
        textarea { width: 80%; height: 80vh; margin-top: 20px; padding: 20px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <textarea id="editor" placeholder="Start typing..."></textarea>
    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const editor = document.getElementById('editor');

        // 1. Load initial document state
        socket.on('load-document', (content) => {
            editor.value = content;
        });

        // 2. Listen for typing in the textarea
        editor.addEventListener('input', (e) => {
            const content = e.target.value;
            socket.emit('send-changes', content);
        });

        // 3. Receive updates from other users
        socket.on('receive-changes', (content) => {
            // Only update if content is different to avoid cursor jumping issues
            if (editor.value !== content) {
                const cursorPosition = editor.selectionStart; // Save cursor
                editor.value = content;
                editor.selectionStart = editor.selectionEnd = cursorPosition; // Restore cursor
            }
        });
    </script>
</body>
</html>
