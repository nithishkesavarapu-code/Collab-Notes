<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collab Notes</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; height: 100vh; background: #f0f2f5; }
        textarea { width: 80%; height: 80vh; margin-top: 20px; padding: 20px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <textarea id="editor" placeholder="Start typing..."></textarea>
    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const editor = document.getElementById('editor');

        // 1. Setup Room ID via URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room');
        
        // If no room is specified in the URL, prompt the user for one
        if (!roomId) {
            roomId = prompt("Enter a room name to join or create:") || 'default-room';
            window.history.pushState({}, '', `?room=${roomId}`);
        }

        // 2. Request the document for this specific room
        socket.emit('get-document', roomId);

        // 3. Load initial document state from database
        socket.on('load-document', (content) => {
            editor.value = content;
        });

        // 4. Listen for typing and send changes/save requests
        editor.addEventListener('input', (e) => {
            const content = e.target.value;
            socket.emit('send-changes', content);
            
            // Persist to database (in a real app, you'd want to debounce this!)
            socket.emit('save-document', content);
        });

        // 5. Receive updates from other users in the same room
        socket.on('receive-changes', (content) => {
            if (editor.value !== content) {
                const cursorPosition = editor.selectionStart; 
                editor.value = content;
                editor.selectionStart = editor.selectionEnd = cursorPosition; 
            }
        });
    </script>
</body>
</html>
